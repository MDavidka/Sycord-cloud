  <title>Terminal · Airshell</title>
  <style>
    .terminal-main { overflow-y:auto !important; overflow-x:hidden !important; background:linear-gradient(180deg,#131313 0%,#131313 62%,#1b1d1e 100%) !important; }
    .terminal-main .terminal-layout { min-height:100%; display:flex; flex-direction:column; gap:18px; padding:28px clamp(14px,3vw,30px) max(20px,env(safe-area-inset-bottom)); box-sizing:border-box; }
    .terminal-main .terminal-meta { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .terminal-main .terminal-meta h1 { margin:0; color:#f2f2f3; font-size:clamp(22px,3vw,28px); font-weight:620; letter-spacing:-.04em; }
    .terminal-main .terminal-meta p { margin:7px 0 0; color:#96969c; font-size:13px; line-height:1.5; }
    .terminal-main .terminal-actions { display:flex; align-items:center; gap:8px; }
    .terminal-main .terminal-action { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:38px; padding:0 12px; border:1px solid #333336; border-radius:11px; background:#19191b; color:#e5e5e8; font:500 13px Geist,system-ui,sans-serif; text-decoration:none; cursor:pointer; }
    .terminal-main .terminal-action svg { width:16px; height:16px; }
    .terminal-main .terminal-card { display:flex; flex:1 0 min(520px,calc(100dvh - 190px)); min-height:360px; flex-direction:column; overflow:hidden; border:1px solid #2d2d30; border-radius:17px; background:#101011; box-shadow:0 10px 36px #0002; }
    .terminal-main .terminal-bar { min-height:44px; padding:0 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid #29292c; background:#18181a; }
    .terminal-main .terminal-host { display:flex; align-items:center; gap:10px; min-width:0; color:#c8c8cc; font-size:12px; }
    .terminal-main .window-dots { display:flex; gap:5px; }
    .terminal-main .window-dots i { width:7px;height:7px;border-radius:50%;background:#5c5c60; }
    .terminal-main .term-state { display:inline-flex;align-items:center;gap:7px;color:#929298;font-size:12px;white-space:nowrap; }
    .terminal-main .term-state .status-dot { width:6px;height:6px;border-radius:50%;background:#777;margin:0; }
    .terminal-main .terminal-clear { border:0; background:transparent; color:#b9b9be; padding:6px 8px; font:500 12px Geist,system-ui,sans-serif; border-radius:7px; cursor:pointer; }
    .terminal-main .terminal-clear:hover { background:#29292c;color:#fff; }
    .terminal-main .term-content { flex:1; min-height:0; padding:14px; }
    .terminal-main #terminal { width:100%; height:100%; min-height:330px; }
    .terminal-main .xterm { height:100%; }
    .terminal-main .terminal-footer { display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid #252528;background:#151516;color:#77777e;font-size:11px;line-height:1.45; }
    @media(max-width:600px) {
      .terminal-main .terminal-layout { gap:14px; padding:21px 12px max(16px,env(safe-area-inset-bottom)); }
      .terminal-main .terminal-meta { align-items:flex-start; }
      .terminal-main .terminal-meta h1 { font-size:23px; }
      .terminal-main .terminal-meta p { font-size:12px; }
      .terminal-main .terminal-actions .back-label { display:none; }
      .terminal-main .terminal-action { min-height:36px; padding:0 10px; }
      .terminal-main .terminal-card { min-height:calc(100dvh - 190px); flex-basis:calc(100dvh - 190px); border-radius:14px; }
      .terminal-main .terminal-bar { padding:0 10px; min-height:42px; }
      .terminal-main .term-content { padding:8px; }
      .terminal-main #terminal { min-height:calc(100dvh - 270px); }
      .terminal-main .terminal-footer { flex-direction:column;gap:3px;padding:9px 11px; }
    }
  
    .terminal-main > .terminal-keypad {
      position:absolute; z-index:14; left:clamp(16px,3.2vw,32px); right:clamp(16px,3.2vw,32px);
      bottom:calc(max(24px,env(safe-area-inset-bottom)) + 76px);
      display:flex; align-items:center; gap:7px; overflow-x:auto; padding:0 2px 2px;
      scrollbar-width:none; -webkit-overflow-scrolling:touch;
    }
    .terminal-main > .terminal-keypad::-webkit-scrollbar { display:none; }
    .terminal-main > .terminal-keypad button {
      flex:0 0 auto; min-height:30px; padding:5px 10px; border:1px solid #303034;
      border-radius:10px; background:#1b1b1d; color:#b7b7bd;
      font:500 12px/1 Geist,ui-sans-serif,system-ui,sans-serif; cursor:pointer;
      touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    }
    .terminal-main > .terminal-keypad button:active { background:#343438; color:#fff; transform:scale(.97); }
    .terminal-main > .terminal-command-composer { display:flex !important; }
    .terminal-main > .terminal-command-composer input[type="text"] { min-width:0; flex:1; height:40px; padding:8px 2px; border:0; outline:0; background:transparent; color:#f5f5f5; font:400 15px/1.35 Geist,ui-sans-serif,system-ui,sans-serif; }
    .terminal-main > .terminal-command-composer input[type="text"]::placeholder { color:#737373; opacity:1; }
    .terminal-main > .terminal-command-composer input[type="text"]:disabled { opacity:.55; }
    /* Minimal terminal canvas with the same dark composer treatment as Home. */
    html { color-scheme: dark; }
    body.airshell-home { background:#121212; }
    .terminal-main { top:calc(76px + env(safe-area-inset-top, 0px)) !important; inset-inline:0 !important; bottom:0 !important; overflow:hidden !important; background:linear-gradient(180deg,#121212 0%,#121212 58%,#171919 100%) !important; }
    .terminal-main #terminal { position:absolute; inset:16px 20px 100px; min-height:0; height:auto; }
    .terminal-main .xterm { height:100%; padding:0; }
    .terminal-main .xterm-viewport, .terminal-main .xterm-screen, .terminal-main .xterm canvas { background:transparent !important; }
    .terminal-main .terminal-internal-status { display:none; }
    .terminal-main > .terminal-command-composer {
      display:flex !important; position:absolute !important; z-index:15;
      left:clamp(16px,3.2vw,32px); right:clamp(16px,3.2vw,32px);
      bottom:max(24px,env(safe-area-inset-bottom)); width:auto; margin:0;
      min-height:64px; height:64px; align-items:center; gap:9px; padding:8px 10px 8px 20px;
      border:1px solid #2a2a2e; border-radius:999px; background:#181819 !important;
      box-shadow:0 0 0 1px #202022; box-sizing:border-box;
      -webkit-backdrop-filter:none; backdrop-filter:none;
    }
    .terminal-main > .terminal-command-composer input[type="text"] {
      display:block; min-width:0; flex:1; width:100%; height:40px; min-height:40px;
      margin:0; padding:8px 2px; border:0; border-radius:0; outline:0;
      appearance:none; -webkit-appearance:none; box-shadow:none;
      background:transparent !important; color:#f5f5f5 !important;
      font:400 16px/1.35 Geist,ui-sans-serif,system-ui,sans-serif;
      transform:none; touch-action:manipulation; -webkit-text-size-adjust:100%;
    }
    .terminal-main > .terminal-command-composer input[type="text"]::placeholder { color:#a0a0a5 !important; opacity:1; }
    .terminal-main > .terminal-command-composer input[type="text"]:focus { background:transparent !important; outline:none; box-shadow:none; }
    .terminal-main > .terminal-command-composer .composer-send { flex:0 0 40px; width:40px; height:40px; border-radius:50%; background:#252527 !important; color:#a0a0a5; }
    .terminal-main > .terminal-command-composer .composer-send.ready { color:#151515; background:#f1f1f1 !important; }
    .terminal-main > .terminal-command-composer .composer-send:disabled { opacity:.5; }
    .terminal-main > .home-disclaimer { display:none !important; }
    @media(max-width:600px) {
      .terminal-main { top:calc(76px + env(safe-area-inset-top, 0px)) !important; }
      .terminal-main #terminal { inset:16px 12px 100px; }
      .terminal-main > .terminal-command-composer {
        left:16px; right:16px; bottom:max(24px,env(safe-area-inset-bottom));
        min-height:60px; height:60px; gap:5px; padding:7px 8px 7px 18px;
      }
      .terminal-main > .terminal-command-composer input[type="text"] { font-size:16px; height:40px; }
    }
</style>
