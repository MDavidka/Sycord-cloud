  <style>
    /* Match the reference: near-black translucent glass on the dark workspace. */
    .home-composer {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 62px;
      padding: 7px 9px 7px 17px;
      border: 1px solid rgba(255,255,255,.12) !important;
      border-radius: 999px;
      background: rgba(31,31,33,.82) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 5px 18px rgb(0 0 0 / 16%) !important;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }
    .home-composer .composer-add {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 32px;
      width: 32px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #d0d0d3 !important;
    }
    .home-composer .composer-add:hover {
      background: rgba(255,255,255,.08);
      color: #fff !important;
    }
    .home-composer .composer-add svg { width: 22px; height: 22px; stroke-width: 1.9; }
    .home-composer textarea {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 32px;
      max-height: 112px;
      padding: 7px 3px;
      color: #f1f1f3 !important;
      font-size: 16px !important;
      line-height: 1.35;
      background: transparent;
    }
    .home-composer textarea::placeholder { color: #a6a6ad !important; opacity: 1; }
    .home-composer .model-select {
      flex: 0 1 auto;
      max-width: 180px;
      min-width: 0;
      padding: 7px 3px;
      gap: 4px;
      color: #e0e0e3 !important;
      font-size: 14px;
    }
    .home-composer .composer-send {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(230,230,235,.14) !important;
      color: #c9c9cf !important;
    }
    .home-composer .composer-send.ready {
      background: #ededf0 !important;
      color: #202124 !important;
    }
    .home-composer .mic-button { display: none !important; }
    @media (max-width: 600px) {
      .home-composer {
        left: 12px;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        min-height: 56px;
        gap: 8px;
        padding: 6px 7px 6px 12px;
      }
      .home-composer .composer-add { flex-basis: 30px; width: 30px; }
      .home-composer .model-select { max-width: 126px; font-size: 12px; }
      .home-composer .composer-send { flex-basis: 36px; width: 36px; height: 36px; }
    }
    @media (max-width: 390px) {
      .home-composer { left: 9px; right: 9px; gap: 6px; padding-left: 10px; }
      .home-composer .model-select { max-width: 102px; font-size: 11px; }
    }
  </style>
  <style id="profile-menu-and-composer-fix">
    /* Keep the profile menu faithful to the reference even if older CSS is cached. */
    .airshell-home .home-topbar .home-profile-menu {
      display: block;
      position: absolute;
      z-index: 999;
      top: calc(100% + 8px);
      right: 12px;
      width: min(320px, calc(100vw - 24px));
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #303033 !important;
      border-radius: 27px !important;
      background: #1f1f20 !important;
      box-shadow: 0 16px 44px rgba(0,0,0,.4) !important;
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
    }
    .airshell-home .home-topbar .home-profile-menu[hidden] { display: none !important; }
    .airshell-home .home-topbar .home-profile-menu .profile-menu-item {
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 18px !important;
      width: 100% !important;
      min-height: 62px !important;
      box-sizing: border-box;
      margin: 0;
      padding: 0 16px !important;
      border: 0 !important;
      border-radius: 0 !important;
      color: #f0f0f2 !important;
      background: transparent !important;
      font-family: inherit !important;
      font-size: 19px !important;
      font-weight: 400 !important;
      line-height: 1.2 !important;
      text-align: left !important;
      text-decoration: none !important;
      cursor: pointer;
    }
    .airshell-home .home-topbar .home-profile-menu .profile-menu-item:hover {
      background: rgba(255,255,255,.045) !important;
    }
    .airshell-home .home-topbar .home-profile-menu .profile-menu-item svg {
      display: block !important;
      width: 24px !important;
      height: 24px !important;
      min-width: 24px;
      flex: 0 0 24px !important;
      margin: 0 !important;
      color: #c4c4c7 !important;
      stroke-width: 1.8;
    }
    .airshell-home .home-topbar .home-profile-menu .profile-menu-item span {
      display: block;
      margin: 0;
      padding: 0;
      line-height: 1.2;
    }
    .airshell-home .home-topbar .home-profile-menu form { display: block; margin: 0 !important; padding: 0; }
    .airshell-home .home-topbar .home-profile-menu .profile-menu-separator {
      display: block;
      height: 1px;
      margin: 7px 2px;
      background: #303033;
    }

    /* Vertically center the prompt text inside the pill; avoid iOS textarea baseline quirks. */
    .home-main.home-dashboard > .home-composer {
      display: flex !important;
      align-items: center !important;
      box-sizing: border-box;
      min-height: 56px;
    }
    .home-main.home-dashboard > .home-composer > #promptInput {
      display: block !important;
      position: static !important;
      align-self: center !important;
      flex: 1 1 0 !important;
      width: 0 !important;
      height: 34px !important;
      min-height: 34px !important;
      max-height: 100px !important;
      box-sizing: border-box !important;
      margin: 0 !important;
      padding: 6px 1px !important;
      border: 0 !important;
      outline: 0;
      transform: none !important;
      translate: none !important;
      line-height: 22px !important;
      vertical-align: middle !important;
      resize: none;
      overflow-y: auto;
      background: transparent !important;
    }
    .home-main.home-dashboard > .home-composer > #promptInput::placeholder {
      line-height: 22px !important;
      opacity: 1;
    }
    @media (max-width: 600px) {
      .airshell-home .home-topbar .home-profile-menu {
        top: calc(100% + 7px);
        right: 12px;
        width: min(320px, calc(100vw - 24px));
      }
      .home-main.home-dashboard > .home-composer {
        align-items: center !important;
      }
      .home-main.home-dashboard > .home-composer > #promptInput {
        height: 34px !important;
        min-height: 34px !important;
        padding-top: 6px !important;
        padding-bottom: 6px !important;
        font-size: 16px !important;
      }
    }
  </style>

    .airshell-home .home-topbar .home-profile-menu .profile-menu-item {

    .airshell-home .home-topbar .home-profile-menu .profile-menu-item:hover {
      background: rgba(255,255,255,.045) !important;
    }
    .airshell-home .home-topbar .home-profile-menu .profile-menu-item svg {
      display: block !important;

      flex: 0 0 24px !important;

    .airshell-home .home-topbar .home-profile-menu .profile-menu-item span {

      margin: 0 !important;
      padding: 0 !important;
      color: inherit !important;

      white-space: nowrap;
    }
    .airshell-home .home-topbar .home-profile-menu form {
      display: block !important;
      width: 100%;
      margin: 0 !important;
      padding: 0 !important;
    }
    .airshell-home .home-topbar .home-profile-menu .profile-menu-separator {
      display: block !important;

      height: 1px !important;

    }
    @media (max-width: 600px) {
      .airshell-home .home-topbar .home-profile-wrap {
        flex-basis: 30px;
        width: 30px;
        height: 30px;
      }
      .airshell-home .home-topbar .home-profile-menu {
        top: calc(100% + 9px) !important;

      .airshell-home .home-topbar .home-profile-menu .profile-menu-item {
        min-height: 62px !important;
        gap: 23px !important;
        padding: 0 18px !important;
        font-size: 23px !important;
      }
    }
  </style>


  <style id="profile-avatar-fallback-fix">
